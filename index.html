<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shailaja Bhardwaj</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    overflow: hidden;
    background: #e8507a;
  }
  .gradient-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, #f9c4d4 0%, transparent 55%),
      radial-gradient(ellipse at 75% 25%, #f47ba8 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, #e8305a 0%, transparent 55%),
      radial-gradient(ellipse at 90% 70%, #c2185b 0%, transparent 45%),
      radial-gradient(ellipse at 10% 20%, #f48fb1 0%, transparent 50%);
    background-color: #e8507a;
  }
  .grain {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    opacity: 0.18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .text {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 40px rgba(150, 20, 60, 0.25);
    line-height: 1.1;
  }
  .icons {
    display: flex;
    flex-direction: row;
    gap: 0.6rem;
  }
  .icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 4px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
  }
  .icons a:hover {
    background: rgba(255,255,255,0.28);
    transform: scale(1.08);
  }
  .icons a svg {
    width: 18px;
    height: 18px;
    fill: #fff;
  }
</style>
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="grain"></div>
  <canvas id="truchet"></canvas>

  <div class="content">
    <p class="text">coming soon :-)</p>
    <div class="icons">
      <a href="https://www.linkedin.com/in/shailajabhardwaj/" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </a>
      <a href="mailto:14sbhardwaj@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('truchet');
    const ctx = canvas.getContext('2d');
    const S = 22;

    function drawTile(x, y, type) {
      const h = S / 2, q = S / 4;
      if (type === 0) {
        ctx.beginPath(); ctx.arc(x, y, h, 0, Math.PI / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + S, y + S, h, Math.PI, Math.PI * 1.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, q, 0, Math.PI / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + S, y + S, q, Math.PI, Math.PI * 1.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y, h + q, 0, Math.PI / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + S, y + S, h + q, Math.PI, Math.PI * 1.5); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(x + S, y, h, Math.PI / 2, Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y + S, h, Math.PI * 1.5, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + S, y, q, Math.PI / 2, Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y + S, q, Math.PI * 1.5, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(x + S, y, h + q, Math.PI / 2, Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, y + S, h + q, Math.PI * 1.5, 0); ctx.stroke();
      }
    }

    function draw() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const cols = Math.ceil(canvas.width / S) + 2;
      const rows = Math.ceil(canvas.height / S) + 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.11)';
      ctx.lineWidth = 0.9;
      ctx.lineCap = 'round';
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          drawTile(c * S, r * S, Math.random() < 0.5 ? 0 : 1);
    }

    draw();
    window.addEventListener('resize', draw);
  </script>
</body>
</html>
