<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shailaja Bhardwaj</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bricolage Grotesque', sans-serif;
    overflow: hidden;
    background: #e8507a;
  }
  .gradient-bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, #f9c4d4 0%, transparent 55%),
      radial-gradient(ellipse at 75% 25%, #f47ba8 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, #e8305a 0%, transparent 55%),
      radial-gradient(ellipse at 90% 70%, #c2185b 0%, transparent 45%),
      radial-gradient(ellipse at 10% 20%, #f48fb1 0%, transparent 50%);
    background-color: #e8507a;
  }
  .grain {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    opacity: 0.18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .text {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 40px rgba(150, 20, 60, 0.25);
    line-height: 1.1;
  }
</style>
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="grain"></div>
  <canvas id="truchet"></canvas>
  <div class="content">
    <p class="text">coming soon :-)</p>
  </div>
  <script>
    const canvas = document.getElementById('truchet');
    const ctx = canvas.getContext('2d');
    const S = 28;

    function draw() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const cols = Math.ceil(canvas.width / S) + 1;
      const rows = Math.ceil(canvas.height / S) + 1;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.13)';
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * S;
          const y = r * S;
          const type = Math.random() < 0.5 ? 0 : 1;
          ctx.beginPath();
          if (type === 0) {
            ctx.arc(x, y, S / 2, 0, Math.PI / 2);
            ctx.arc(x + S, y + S, S / 2, Math.PI, Math.PI * 1.5);
          } else {
            ctx.arc(x + S, y, S / 2, Math.PI / 2, Math.PI);
            ctx.arc(x, y + S, S / 2, Math.PI * 1.5, 0);
          }
          ctx.stroke();
        }
      }
    }

    draw();
    window.addEventListener('resize', draw);
  </script>
</body>
</html>
